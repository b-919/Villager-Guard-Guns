plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.modrinth.minotaur' version '2.8.10'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run-forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run-forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    implementation fg.deobf("maven.modrinth:guard-villagers:${guardvillagers_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}

def modrinthProjectId = providers.gradleProperty('modrinth_project_id').getOrElse('')
def modrinthToken = providers.gradleProperty('modrinth_token')
        .orElse(providers.environmentVariable('MODRINTH_TOKEN'))
        .getOrNull()
def curseforgeProjectId = providers.gradleProperty('curseforge_project_id').getOrElse('')
def curseforgeToken = providers.gradleProperty('curseforge_token')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))
        .getOrNull()
def curseforgeTaczSlug = providers.gradleProperty('curseforge_tacz_slug')
        .getOrElse('timeless-and-classics-zero')
def curseforgeGuardVillagersSlug = providers.gradleProperty('curseforge_guardvillagers_slug')
        .getOrElse('guard-villagers')
def publishChangelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md'))
        .asText.getOrElse("Release ${mod_version}")
def modrinthProjectMissing = modrinthProjectId.isBlank()
def modrinthTokenMissing = modrinthToken == null || modrinthToken.isBlank()
def curseforgeProjectMissing = curseforgeProjectId.isBlank()
def curseforgeTokenMissing = curseforgeToken == null || curseforgeToken.isBlank()

modrinth {
    if (modrinthToken != null && !modrinthToken.isBlank()) {
        token = modrinthToken
    }
    projectId = modrinthProjectId
    versionNumber = "${mod_version}+${minecraft_version}"
    versionName = "${mod_name} ${mod_version} for ${minecraft_version} (Forge)"
    versionType = 'release'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['forge']
    changelog = publishChangelog
    dependencies {
        required.version 'timeless-and-classics-zero', tacz_version
        required.version 'guard-villagers', guardvillagers_version
    }
}

tasks.named('modrinth') {
    notCompatibleWithConfigurationCache('Minotaur uploads are not configuration-cache compatible')
    dependsOn tasks.named('build')
    doFirst {
        if (modrinthProjectMissing) {
            throw new GradleException('Set modrinth_project_id in gradle.properties or pass -Pmodrinth_project_id=...')
        }
        if (modrinthTokenMissing) {
            throw new GradleException('Set MODRINTH_TOKEN in the environment or modrinth_token in ~/.gradle/gradle.properties')
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Builds the Forge mod and uploads it to Modrinth.'
    dependsOn tasks.named('modrinth')
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds the Forge mod and uploads it to CurseForge.'
    notCompatibleWithConfigurationCache('CurseForgeGradle uploads are not configuration-cache compatible')
    dependsOn tasks.named('build')

    if (curseforgeToken != null && !curseforgeToken.isBlank()) {
        apiToken = curseforgeToken
    }

    def mainFile = upload(curseforgeProjectId.isBlank() ? '0' : curseforgeProjectId, jar)
    mainFile.changelog = publishChangelog
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('Forge')
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addRequirement(curseforgeTaczSlug)
    mainFile.addRequirement(curseforgeGuardVillagersSlug)

    doFirst {
        if (curseforgeProjectMissing) {
            throw new GradleException('Set curseforge_project_id in gradle.properties or pass -Pcurseforge_project_id=...')
        }
        if (curseforgeTokenMissing) {
            throw new GradleException('Set CURSEFORGE_TOKEN in the environment or curseforge_token in ~/.gradle/gradle.properties')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

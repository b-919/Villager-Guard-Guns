plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.modrinth.minotaur' version '2.8.10'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Validate access transformer targets at build time (recommended).
    validateAccessTransformers = true

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Timeless and Classics Zero (TaCZ) - NeoForge 1.21.1, version 1.2.0.
    // Version id O2Pfsh6w pins the exact NeoForge 1.21.1 build.
    implementation "maven.modrinth:timeless-and-classics-zero:${tacz_version}"

    // Guard Villagers - NeoForge 1.21.1, version 2.4.12.
    // Version id JyXugpy2 pins the exact NeoForge 1.21.1 build.
    implementation "maven.modrinth:guard-villagers:${guardvillagers_version}"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Modrinth / CurseForge publishing
// Put project IDs in gradle.properties. Tokens belong in the environment or in
// ~/.gradle/gradle.properties, never in this repository.
def modrinthProjectId = providers.gradleProperty('modrinth_project_id').getOrElse('')
def modrinthToken = providers.gradleProperty('modrinth_token')
        .orElse(providers.environmentVariable('MODRINTH_TOKEN'))
        .getOrNull()
def curseforgeProjectId = providers.gradleProperty('curseforge_project_id').getOrElse('')
def curseforgeToken = providers.gradleProperty('curseforge_token')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))
        .getOrNull()
def curseforgeTaczSlug = providers.gradleProperty('curseforge_tacz_slug')
        .getOrElse('timeless-and-classics-zero')
def curseforgeGuardVillagersSlug = providers.gradleProperty('curseforge_guardvillagers_slug')
        .getOrElse('guard-villagers')
def publishChangelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md'))
        .asText.getOrElse("Release ${mod_version}")
def modrinthProjectMissing = modrinthProjectId.isBlank()
def modrinthTokenMissing = modrinthToken == null || modrinthToken.isBlank()
def curseforgeProjectMissing = curseforgeProjectId.isBlank()
def curseforgeTokenMissing = curseforgeToken == null || curseforgeToken.isBlank()

// Requires the Modrinth version IDs (hashes) for TaCZ and Guard Villagers.
modrinth {
    if (modrinthToken != null && !modrinthToken.isBlank()) {
        token = modrinthToken
    }
    projectId = modrinthProjectId
    versionNumber = "${mod_version}+${minecraft_version}"
    versionName = "${mod_name} ${mod_version} for ${minecraft_version}"
    versionType = 'release'
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
    changelog = publishChangelog
    dependencies {
        required.version 'timeless-and-classics-zero', tacz_version
        required.version 'guard-villagers', guardvillagers_version
    }
}

tasks.named('modrinth') {
    notCompatibleWithConfigurationCache('Minotaur uploads are not configuration-cache compatible')
    dependsOn tasks.named('build')
    doFirst {
        if (modrinthProjectMissing) {
            throw new GradleException('Set modrinth_project_id in gradle.properties or pass -Pmodrinth_project_id=...')
        }
        if (modrinthTokenMissing) {
            throw new GradleException('Set MODRINTH_TOKEN in the environment or modrinth_token in ~/.gradle/gradle.properties')
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Builds the mod and uploads it to Modrinth.'
    dependsOn tasks.named('modrinth')
}

// Requires the CurseForge project ID and the dependency project slugs.
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds the mod and uploads it to CurseForge.'
    notCompatibleWithConfigurationCache('CurseForgeGradle uploads are not configuration-cache compatible')
    dependsOn tasks.named('build')

    if (curseforgeToken != null && !curseforgeToken.isBlank()) {
        apiToken = curseforgeToken
    }

    def mainFile = upload(curseforgeProjectId.isBlank() ? '0' : curseforgeProjectId, jar)
    mainFile.changelog = publishChangelog
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('NeoForge')
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addRequirement(curseforgeTaczSlug)
    mainFile.addRequirement(curseforgeGuardVillagersSlug)

    doFirst {
        if (curseforgeProjectMissing) {
            throw new GradleException('Set curseforge_project_id in gradle.properties or pass -Pcurseforge_project_id=...')
        }
        if (curseforgeTokenMissing) {
            throw new GradleException('Set CURSEFORGE_TOKEN in the environment or curseforge_token in ~/.gradle/gradle.properties')
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

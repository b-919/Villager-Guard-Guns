# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false
## Environment Properties
# Forge 1.20.1
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=1.20.1-47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=guardsgun
# The human-readable display name for the mod.
mod_name=GuardsGun
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.b919
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=b919
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Bored of your guards using their simple swords and crossbows? Make their lives more fun and make them use and spawn with Timeless and Classics Zero (TaCZ) guns!

## Integration Dependencies
# TaCZ (Timeless and Classics Zero) - Forge 1.20.1, 1.2.0.
# This is the Modrinth maven version id that pins the exact Forge 1.20.1 build.
# It is also used as the Modrinth version id for the required Modrinth dependency.
tacz_version=QGCbNkTy
# Guard Villagers - Forge/NeoForge 1.20.1, 1.6.19.
# This is the Modrinth maven version id that pins the exact 1.20.1 build.
# It is also used as the Modrinth version id for the required Modrinth dependency.
guardvillagers_version=zCzBkn3R

## Publishing
# Create the projects first, then fill these in. Do not commit API tokens.
modrinth_project_id=guard-guns
curseforge_project_id=1801514
# CurseForge dependency project slugs used by the upload API.
# TaCZ project id: 1028108
curseforge_tacz_slug=timeless-and-classics-zero
# Guard Villagers project id: 360203
curseforge_guardvillagers_slug=guard-villagers
